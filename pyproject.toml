[project]
name = "sdxlr"
version = "0.1.0"
description = "Colab T4 toolkit: caption, train, compare and generate with SDXL LoRAs"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Versions match vendor/sd-scripts (kohya v0.12.2) requirements.txt,
# so training and generation share one venv.
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "diffusers==0.40.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "gguf==0.19.0",
    "gradio==6.30.0",
    "timm==1.0.30",  # WD tagger
    "nicegui==3.18.0",
    "nvidia-ml-py==13.615.71",  # GPU memory per process for the sidebar
    "pyyaml",
    "psutil",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
